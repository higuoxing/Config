name: Bootstrap

# Full deployment test: runs scripts/bootstrap.sh end to end in an
# Arch Linux container. Heavy (large packages, AUR builds), so it only
# runs on demand or weekly, not on every push.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  bootstrap:
    name: Full bootstrap in Arch container
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: archlinux:latest
    steps:
      - name: Install git, sudo, and build tools
        run: pacman -Sy --noconfirm git sudo base-devel

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create build user
        run: |
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Run bootstrap.sh
        run: su - builder -c "cd '$GITHUB_WORKSPACE' && ./scripts/bootstrap.sh"
